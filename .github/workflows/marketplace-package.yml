name: Build Moodle packages

on:
  push:
    branches: [main, marketplace-readiness]
    paths:
      - 'plugins/**'
      - 'tools/build_packages.py'
      - '.github/workflows/marketplace-package.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'tools/build_packages.py'
      - '.github/workflows/marketplace-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify separate Moodle components
        run: python3 tools/build_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: moodle-plugin-packages
          path: dist/*.zip
          if-no-files-found: error
