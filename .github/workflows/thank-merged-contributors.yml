name: Thank merged contributors

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  thank-contributor:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Thank contributor
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const body = [
              `Thanks @${author} for contributing to AI Skill Navigator!`,
              '',
              'If you enjoyed contributing or find the project useful, consider starring the repository.',
              'A star is appreciated, but it is never required for review or merge.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
